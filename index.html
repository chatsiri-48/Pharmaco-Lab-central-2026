<!DOCTYPE html>
<html lang="en">
<head>
<title>Lab Stock</title>
<meta name="theme-color" content="#1f5fbf">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
  :root{--bg:#f3f5f9;--card:#fff;--ink:#1d2433;--mute:#667085;--line:#e3e7ee;--pri:#1f5fbf;--pri-l:#e7efff;--ok:#1e7f4a;--ok-l:#eaf6ef;--warn:#a86400;--bad:#c62828}
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Noto Sans Thai","Leelawadee UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:16px;line-height:1.45}
  header{background:var(--pri);color:#fff;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));display:flex;justify-content:space-between;align-items:center;gap:8px}
  header b{font-size:18px} header small{opacity:.85;font-size:13px}
  nav{display:flex;gap:4px;overflow-x:auto;padding:6px 10px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:6;-webkit-overflow-scrolling:touch;scrollbar-width:none}
  nav::-webkit-scrollbar{display:none}
  nav button{flex:0 0 auto;white-space:nowrap;border:0;background:none;padding:10px 14px;border-radius:10px;font:inherit;font-size:15px;color:var(--mute);cursor:pointer;min-height:44px}
  nav button.on{background:var(--pri-l);color:var(--pri);font-weight:600}
  main{max-width:1080px;margin:0 auto;padding:14px 14px calc(24px + env(safe-area-inset-bottom))}
  main.wide{max-width:1320px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .card.flush{padding:0} .card.flush>.hd{padding:14px 14px 6px}
  .card.flush>.bar{border-radius:0 0 14px 14px}
  h2{font-size:18px;margin:0 0 10px} h3{font-size:16px;margin:0 0 8px}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:8px 0}
  .row.sb{justify-content:space-between}
  .grow{flex:1 1 220px;min-width:0}
  input,select,textarea{font:inherit;font-size:16px;padding:9px 11px;border:1px solid #cfd5e1;border-radius:10px;background:#fff;max-width:100%;min-height:44px;color:inherit}
  input[type=checkbox]{min-height:0;width:20px;height:20px;vertical-align:middle}
  input[type=number]{width:96px;text-align:right}
  textarea{width:100%;min-height:64px}
  label.ck{display:flex;align-items:center;gap:8px;padding:6px 0;cursor:pointer}
  button.b{font:inherit;font-size:15px;border:0;border-radius:10px;padding:10px 16px;cursor:pointer;background:var(--pri);color:#fff;min-height:44px}
  button.b.sec{background:#e9edf5;color:var(--ink)} button.b.ok{background:var(--ok)} button.b.bad{background:var(--bad)}
  button.b.sm{min-height:36px;padding:6px 12px;font-size:14px}
  button.b:disabled{opacity:.45;cursor:default}
  button.link{border:0;background:none;color:var(--pri);font:inherit;font-size:14px;cursor:pointer;padding:6px 0}
  .badge{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:600;white-space:nowrap}
  .OK,.RECEIVED,.MATCHED,.ADJUSTED,.INCART{background:#e3f4ea;color:var(--ok)}
  .LOW,.PENDING_APPROVAL,.PENDING,.SUBMITTED{background:#fff2d9;color:var(--warn)}
  .OUT,.REJECTED{background:#fde4e4;color:var(--bad)}
  .NC,.SELF{background:#f3ecff;color:#6a3fb5}
  .ctool{position:sticky;top:-16px;background:#fff;z-index:3;padding:8px 0;margin:0 0 4px;border-bottom:1px solid var(--line)}
  .ctool .row{margin:6px 0}
  .cgrid{display:grid;grid-template-columns:minmax(0,1fr) 48px 64px 46px;gap:8px;align-items:center}
  .chead{font-size:12px;color:var(--mute);padding:2px 2px 0;text-transform:uppercase;letter-spacing:.03em}
  .chead span{text-align:center}
  .cr{padding:5px 2px;border-bottom:1px solid var(--line)}
  .cr .cn{overflow:hidden;white-space:nowrap;text-overflow:ellipsis;font-size:15px;cursor:pointer;padding:6px 0}
  .cr .cs{text-align:center;font-weight:700;font-size:16px}
  .cr .ci{width:64px;min-height:38px;padding:4px 6px;text-align:center;font-weight:700;font-size:16px}
  .cr .ci::-webkit-outer-spin-button,.cr .ci::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
  .cr .ci{-moz-appearance:textfield;appearance:textfield}
  .cr.done .ci{background:#eaf6ef;border-color:#9fd3b4}
  .cr.diff .ci{background:#fff6e5;border-color:#f0c36d}
  .cr .cv{text-align:center;font-weight:700;font-size:16px}
  .cd{font-size:13px;font-weight:700;text-align:center;border-radius:99px;padding:3px 0;min-height:22px}
  .cd.n{background:#fde4e4;color:var(--bad)} .cd.p{background:#e3ecfb;color:var(--pri)}
  .cx{grid-column:1/-1;padding:4px 0 8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center}
  .cx .full{flex:1 1 100%;font-size:14px;font-weight:600} .cx input.note{flex:1 1 180px;min-height:38px}
  .savest{font-size:12px;color:var(--mute)} .savest.err{color:var(--bad)}
  .who-box{display:flex;align-items:center;gap:12px;background:#eef4ff;border:1px solid #d6e3fb;border-radius:12px;padding:10px 12px;margin:6px 0 8px}
  .who-av{flex:0 0 auto;width:42px;height:42px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:16px}
  .who-box .lbl{font-size:12px;color:var(--mute);text-transform:uppercase;letter-spacing:.04em}
  .who-box .nm{font-size:19px;font-weight:700;line-height:1.25;overflow-wrap:anywhere}
  .who-box .sub{font-size:13px;color:var(--mute);overflow-wrap:anywhere}
  .pilot-tag{display:inline-block;background:#ffcc00;color:#3b2a00;font-size:11px;font-weight:700;padding:1px 7px;border-radius:99px;margin-left:6px;vertical-align:2px}
  .note-box{background:#f6f2ff;border:1px solid #e1d6fa;color:#4b2f86;border-radius:12px;padding:10px 14px;font-size:14px;margin-bottom:12px}
  .seg2{display:flex;gap:6px;margin:4px 0 10px} .seg2 button{flex:1}
  .pw-row{display:flex;gap:6px;align-items:center} .pw-row input{flex:1;min-width:0}
  .APPROVED,.ISSUED{background:#e3ecfb;color:var(--pri)} .CANCELLED,.CLOSED,.OFF{background:#eceef2;color:var(--mute)}
  .mute{color:var(--mute);font-size:13px}
  .warn{color:var(--warn);font-size:13px}
  .diffp{color:var(--ok);font-weight:600} .diffn{color:var(--bad);font-weight:600}
  .li{display:flex;align-items:center;gap:12px;padding:11px 14px;border-top:1px solid var(--line)}
  .li .m{flex:1;min-width:0} .li .m b{display:block;font-weight:600;overflow-wrap:anywhere}
  .li .s{color:var(--mute);font-size:13px}
  .li .r{text-align:right;white-space:nowrap}
  .li .big{font-size:20px;font-weight:700;display:block}
  .li.sel{background:var(--ok-l);box-shadow:inset 4px 0 0 var(--ok)}
  .click{cursor:pointer} .click:hover{background:#f6f9ff}
  .stp{display:flex;align-items:center;gap:4px;flex-shrink:0}
  .stp button{width:40px;height:40px;border-radius:10px;border:1px solid #cfd5e1;background:#fff;font-size:20px;cursor:pointer;color:var(--ink)}
  .stp input{width:64px;text-align:center;min-height:40px;padding:6px}
  .pick{position:relative}
  .pick-in{width:100%;padding-right:38px}
  .pick.has .pick-in{background:var(--ok-l);border-color:#9fd3b4;font-weight:600}
  .pw{position:relative}
  .pick-sub{font-size:13px;color:var(--ok);margin:3px 2px 0}
  .pick-sub:empty{display:none}
  .pick-x{position:absolute;right:4px;top:50%;transform:translateY(-50%);border:0;background:none;font-size:20px;color:var(--mute);width:34px;height:34px;cursor:pointer;border-radius:8px}
  .pick-list{position:absolute;left:0;right:0;top:48px;background:#fff;border:1px solid #cfd5e1;border-radius:10px;box-shadow:0 8px 24px rgba(0,0,0,.14);max-height:300px;overflow:auto;z-index:15}
  .pick-op{padding:9px 12px;cursor:pointer;border-top:1px solid var(--line)} .pick-op:first-child{border-top:0}
  .pick-op b{display:block;font-size:15px;font-weight:600;overflow-wrap:anywhere} .pick-op small{color:var(--mute);font-size:13px}
  .pick-op.act,.pick-op:hover{background:var(--pri-l)}
  .pick-none{padding:12px;color:var(--mute);font-size:14px}
  .rcv{border-top:1px solid var(--line);padding-top:10px}
  .rcv:first-child{border-top:0;padding-top:0}
  .seg{display:flex;gap:4px;background:#eef1f6;border-radius:10px;padding:3px;flex-wrap:wrap}
  .seg button{border:0;background:none;font:inherit;font-size:14px;padding:7px 12px;border-radius:8px;cursor:pointer;color:var(--mute);min-height:36px}
  .seg button.on{background:#fff;color:var(--ink);font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.08)}
  /* request page: list + cart */
  .req-grid{display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:14px;align-items:start}
  .cart-side{position:sticky;top:66px;max-height:calc(100vh - 80px);overflow:auto}
  .cl{display:flex;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .cl:first-child{border-top:0}
  .cl .m{flex:1;min-width:0} .cl .m b{display:block;font-size:14px;font-weight:600;overflow-wrap:anywhere}
  .cl .rm{border:0;background:none;color:var(--mute);font-size:22px;width:36px;height:36px;cursor:pointer;flex-shrink:0;border-radius:8px}
  .cl .rm:hover{background:#fde4e4;color:var(--bad)}
  .cl .stp button{width:34px;height:34px;font-size:18px} .cl .stp input{width:52px;min-height:34px}
  #modal.sheet .x{display:none}
  .sheet-top{display:flex;align-items:center;margin:-4px 0 12px;padding-bottom:10px;border-bottom:1px solid var(--line)}
  button.link.danger{color:var(--bad)}
  .empty-cart{border:1px dashed #cfd5e1;border-radius:10px;padding:16px;text-align:center;color:var(--mute);font-size:14px}
  .bar.mobile-only{display:none}
  .tw{overflow-x:auto}
  table{width:100%;border-collapse:collapse}
  th,td{padding:8px 9px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{font-size:13px;color:var(--mute);font-weight:600;background:#fafbfd}
  td.n,th.n{text-align:right;white-space:nowrap}
  td.c,th.c{text-align:center;white-space:nowrap}
  td.c .stp{justify-content:center}
  .bar{position:sticky;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 14px;padding-bottom:max(10px,env(safe-area-inset-bottom));display:flex;justify-content:space-between;align-items:center;gap:10px;z-index:4}
  .modal{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:flex-start;justify-content:center;padding:30px 12px;z-index:20;overflow:auto;-webkit-overflow-scrolling:touch}
  .modal .box{background:#fff;border-radius:14px;max-width:880px;width:100%;padding:16px;position:relative}
  .x{position:absolute;right:8px;top:4px;border:0;background:none;font-size:28px;cursor:pointer;width:44px;height:44px;color:var(--mute)}
  .hidden{display:none!important}
  #dlg{position:fixed;inset:0;background:rgba(15,20,30,.45);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
  #dlg .box{background:#fff;border-radius:14px;max-width:420px;width:100%;padding:18px;box-shadow:0 10px 30px rgba(0,0,0,.2)}
  #dlg p{margin:0 0 16px;font-size:16px}
  #dlg .row{justify-content:flex-end;margin:0}
  #toast{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:12px 18px;border-radius:10px;z-index:30;max-width:92%;display:none}
  #toast.err{background:var(--bad)}
  #busy{position:fixed;top:0;left:0;right:0;height:4px;overflow:hidden;display:none;z-index:45;background:rgba(31,95,191,.15)}
  #busy::before{content:'';position:absolute;top:0;left:-40%;width:40%;height:100%;background:#ffcc00;animation:slide 1s ease-in-out infinite}
  @keyframes slide{from{left:-40%}to{left:100%}}
  .spin{display:inline-block;width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:rot .7s linear infinite;vertical-align:-3px}
  .spin.lg{width:34px;height:34px;border-width:3px;color:var(--pri)}
  @keyframes rot{to{transform:rotate(360deg)}}
  button.loading{pointer-events:none;opacity:.85}
  button.loading .spin{margin-right:6px}
  #wait{position:fixed;inset:0;z-index:60;display:none;align-items:center;justify-content:center;background:rgba(255,255,255,.55);cursor:progress}
  #wait.on{display:flex}
  #wait .box{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px 22px;display:flex;align-items:center;gap:14px;box-shadow:0 10px 30px rgba(0,0,0,.15);max-width:86%}
  #wait b{display:block} #wait span{color:var(--mute);font-size:13px}
  @keyframes p{0%{opacity:.3}50%{opacity:1}100%{opacity:.3}}
  .chips{display:flex;flex-wrap:wrap;gap:6px} .chip{background:#eef2f8;border-radius:99px;padding:3px 10px;font-size:13px}
  .qrgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .qr{border:1px dashed #999;padding:8px;text-align:center;font-size:12px;break-inside:avoid}
  .qr div{display:flex;justify-content:center;margin-bottom:4px}
  @media (max-width:900px){
    .req-grid{grid-template-columns:minmax(0,1fr)}
    .cart-side{display:none}
    .bar.mobile-only{display:flex}
  }
  @media (max-width:720px){
    main{padding:10px 10px calc(24px + env(safe-area-inset-bottom))}
    .card{border-radius:12px}
    header b{font-size:16px}
    table.rsp thead{display:none}
    table.rsp,table.rsp tbody,table.rsp tr,table.rsp td{display:block;width:100%}
    table.rsp tr{border:1px solid var(--line);border-radius:10px;margin-bottom:8px;padding:6px 12px;background:#fff}
    table.rsp td{border:0;padding:5px 0;display:flex;justify-content:space-between;align-items:center;gap:12px;text-align:right;white-space:normal}
    table.rsp td::before{content:attr(data-label);color:var(--mute);font-size:13px;text-align:left;flex-shrink:0;max-width:45%}
    table.rsp td.main{display:block;text-align:left;font-weight:600;font-size:16px;padding-top:6px}
    table.rsp td.main::before{display:none}
    table.rsp td.empty{display:block;text-align:center} table.rsp td.empty::before{display:none}
    table.rsp td input:not([type=number]){flex:1;min-width:0}
    .modal{padding:0} .modal .box{border-radius:0;min-height:100%;padding:14px 12px calc(14px + env(safe-area-inset-bottom))}
    .row>select,.row>input:not([type=number]):not([type=checkbox]){flex:1 1 100%}
  }
  @media print{header,nav,.noprint,.bar{display:none!important} body{background:#fff} .card{border:0} .modal{position:static;background:none;padding:0} .modal .box{max-width:none}}
</style>
</head>
<body>
<div id="busy"></div>
<div id="wait" role="status" aria-live="polite"><div class="box"><i class="spin lg"></i><div><b id="waitT">Working…</b><span id="waitS">Please wait</span></div></div></div>
<header><div><b id="labName">Lab Stock</b><br><small id="who"></small></div>
  <button class="b sec sm noprint" id="logoutBtn" style="display:none" onclick="logout()">Sign out</button></header>
<nav id="nav"></nav>
<main id="view"><p class="mute">Loading...</p></main>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="box"><button class="x" aria-label="Close" onclick="closeModal()">×</button><div id="mbody"></div></div></div>
<div id="toast"></div>
<div id="dlg" class="hidden" role="dialog" aria-modal="true"><div class="box"><p id="dlgMsg"></p><div class="row"><button class="b sec" id="dlgNo">Cancel</button><button class="b" id="dlgYes">OK</button></div></div></div>

window.LABSTOCK_API = "https://script.google.com/macros/s/AKfycbwsFufREWb9EXLlwAN_qfPp_vdsH_S4vy_b8MkMpP9qKFSVQgmlDChbyg8oQ5LqZM79/exec";
window.google = { script: { run: new Proxy({}, { get: function (_, first) {
  var ok = null, bad = null;
  var p = new Proxy({}, { get: function (_, k) {
    if (k === 'withSuccessHandler') return function (f) { ok = f; return p; };
    if (k === 'withFailureHandler') return function (f) { bad = f; return p; };
    return function () {

      fetch(window.LABSTOCK_API, { method: 'POST', credentials: 'omit', redirect: 'follow', cache: 'no-store',

        .catch(function (e) { bad && bad(e && e.message ? e : new Error(String(e))); });
    };
  } });
  return p[first];
} }) } };

function showStartError(e){

let REQS = {requests:[], balances:null};

function reqCard(r){
  const id = r.ReqID, mine = String(r.RequesterEmail).toLowerCase() === ME.email, isApv = String(r.ApproverEmail).toLowerCase() === ME.email;
  const both = r.Status === 'PENDING_APPROVAL' && isApv && can('ISSUE');
  const issuing = (r.Status === 'APPROVED' && can('ISSUE')) || both, bal = REQS.balances || {};
  const selfApproved = r.ApprovedBy && String(r.ApprovedBy).toLowerCase() === String(r.RequesterEmail).toLowerCase();
  let table;
  if (issuing) table = tbl([{h:'Item',main:1},{h:'Requested',c:1},{h:'In stock',c:1},{h:both?'Give':'Issue now',c:1},{h:'Note to requester'}],
    r.lines.map(l => { const req = Number(l.QtyRequested), have = bal[l.ItemID] || 0;
      const def = MODE.counted ? Math.min(req, Math.max(0, have)) : req;
      return [esc(l.ItemName), req, `<span class="mute">${MODE.counted ? have : '—'}</span>`,
        `<div class="stp"><button type="button" aria-label="Decrease" onclick="stepNum(this,-1,0)">−</button><input type="number" inputmode="numeric" min="0" max="${req}" value="${def}" data-iss="${esc(l.ItemID)}"><button type="button" aria-label="Increase" onclick="stepNum(this,1,0)">+</button></div>`,
        `<input placeholder="${def<req?'e.g. only 1 box left':'optional'}" data-note="${esc(l.ItemID)}" style="width:100%">`]; }));
  else table = tbl([{h:'Item',main:1},{h:'Requested',c:1},{h:'Issued',c:1},{h:'Note'}],
    r.lines.map(l => { const short = l.QtyIssued !== '' && Number(l.QtyIssued) < Number(l.QtyRequested);
      return [esc(l.ItemName), l.QtyRequested, `<span class="${short?'diffn':''}">${l.QtyIssued===''?'-':l.QtyIssued}</span>`, esc(l.IssueNote)]; }));
  let actions = '';
  if (both) actions += `<input id="an_${id}" placeholder="Message to requester (required when rejecting)" class="grow">
      <button class="b ok" onclick="approveIssue('${id}')">Approve &amp; issue</button><button class="b bad" onclick="approve('${id}',false)">Reject</button>`;
  else if (r.Status === 'PENDING_APPROVAL' && isApv) actions += `<input id="an_${id}" placeholder="Note (required when rejecting)" class="grow">
      <button class="b ok" onclick="approve('${id}',true)">Approve</button><button class="b bad" onclick="approve('${id}',false)">Reject</button>`;
  if (r.Status === 'PENDING_APPROVAL' && mine) actions += `<button class="b sec" onclick="cancelReq('${id}')">Cancel request</button>`;

  const ids = [...c.dirty]; c.dirty.clear(); c.saving = true; if (c === CNT) cntStatus('Saving…');
  try {
    await call('saveCountDraft', { sessionId: c.s.SessionID, lines: ids.map(id => { const l = c.lines.find(x => x.id === id); return { itemId: id, counted: l.c, note: l.note }; }) });
    if (c === CNT) cntStatus('Saved ' + new Date().toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'}));
  } catch (e) { ids.forEach(id => c.dirty.add(id)); if (c === CNT) cntStatus('Not saved — check connection', true); }
  finally { c.saving = false; if (c.dirty.size && c === CNT) { clearTimeout(c.timer); c.timer = setTimeout(() => cntSave(c), 3000); } }
}
function cntFinish(){ act(async () => {
  const c = CNT; if (!c) return;
  clearTimeout(c.timer);
  const done = c.lines.filter(l => l.c !== ''), diffs = done.filter(l => cntDiff(l) !== 0), skip = c.lines.length - done.length;
  if (!done.length) throw new Error('Nothing has been counted yet');
  const msg = (c.canFinish ? `${diffs.length ? plural(diffs.length, 'item') + ' will be adjusted to the counted quantity.' : 'All counted items match the system.'}`
    : `${diffs.length ? plural(diffs.length, 'difference') + ' will be sent for review.' : 'All counted items match.'}`) +
    (skip ? ` ${plural(skip, 'item')} not counted will stay unchanged.` : '');
  if (!(await ask(msg, c.canFinish ? 'Finish & update stock' : 'Submit'))) return;
  const r = await call('submitCount', { sessionId: c.s.SessionID, lines: c.lines.map(l => ({ itemId: l.id, counted: l.c, note: l.note })) });
  c.dirty.clear(); CNT = null; stale(); closeModal();
  toast(r.status === 'ADJUSTED' ? `Stock updated: ${plural(r.diffCount, 'item')} adjusted` : r.status === 'MATCHED' ? 'Count finished — everything matches' : `Submitted: ${r.diffCount} difference(s) sent for review`);
  viewCount();
}); }
function reviewCnt(id, apply){ act(async () => {
  if (apply && !(await ask('Set the system balances to the counted quantities?', 'Adjust'))) return;
  const r = await call('reviewCount', {sessionId:id, apply, note:$('#rvNote').value}); stale();
  closeModal(); toast(apply ? `Adjusted ${plural(r.adjusted,'item')}` : 'Count closed'); viewCount();
}); }


async function viewLedger(){
  $('#view').innerHTML = `<div class="card"><div class="row sb" style="margin:0"><h2 style="margin:0">History</h2>
    <select id="lt" onchange="loadLedger()"><option value="">All stock movements</option><option value="IN">Received</option><option value="OUT">Issued</option>
      <option value="ADJUST">Adjustments</option><option value="CHANGES">Changes to items, users and roles</option></select></div>
    <div id="lBody" style="margin-top:10px"></div></div>`;
  await loadLedger();
}
async function loadLedger(){
  const t = NAV, sel = $('#lt'), type = sel ? sel.value : '';
  const rows = await call('ledger', {type}); if (moved(t)) return;
  put('#lBody', type === 'CHANGES'
    ? tbl([{h:'Date',main:1},{h:'Record'},{h:'Code'},{h:'Action'},{h:'Details'},{h:'By'}],
        rows.map(c => [fmt(c.Timestamp), ENT_TXT[c.Entity]||c.Entity, esc(c.EntityID), ACT_TXT[c.Action]||c.Action, esc(c.Detail), esc(uname(c.UserEmail))]), 'No changes yet')
    : tbl([{h:'Date',main:1},{h:'Item'},{h:'Type'},{h:'Qty',n:1},{h:'Balance',n:1},{h:'Reference'},{h:'By'},{h:'Note'}],
        rows.map(t => [fmt(t.Timestamp), esc(t.ItemName), TYPE_TXT[t.Type]||t.Type, `<span class="${t.Qty>0?'diffp':'diffn'}">${signed(t.Qty)}</span>`,
          t.BalanceAfter, `<span class="mute">${esc(t.RefID)}</span>`, esc(uname(t.UserEmail)), esc(t.Note)]), 'No movements yet'));
}


async function viewItems(){
  const t = NAV; await loadStock(true); if (moved(t)) return;
  $('#view').innerHTML = `<div class="card flush"><div class="hd"><div class="row sb" style="margin-top:0"><h2 style="margin:0">Items</h2>
      <button class="b sm" onclick="editItem('')">+ Add item</button></div>
      <p class="mute">Tap an item to change its name, unit, reorder point or location, or to delete it. The reorder point is the balance at which low-stock alerts start.</p>
      <div class="row"><input id="iq" type="search" placeholder="Search name or code..." oninput="filterItems()" class="grow"></div></div>
    <div id="itemList"></div></div>`;
  filterItems();
}
function filterItems(){
  const el = $('#iq'); if (!el) return; const q = el.value.trim().toLowerCase();
  put('#itemList', STOCK.filter(s => !q || s.name.toLowerCase().includes(q) || s.id.toLowerCase().includes(q)).map(s =>
    `<div class="li click" data-id="${esc(s.id)}" onclick="editItem(this.dataset.id)" style="${s.active?'':'opacity:.55'}">
      <div class="m"><b>${esc(s.name)}</b><span class="s">${esc(s.id)} · unit: ${esc(s.unit)||'-'} · reorder at: ${s.rp||'-'}${s.location?' · '+esc(s.location):''}</span></div>
      <div class="r">${s.active?'':badge('OFF')} <span class="mute">Edit ›</span></div></div>`).join('') || '<p class="mute" style="padding:14px">No items found</p>');
}
function editItem(id){
  const s = STOCK.find(x => x.id === id) || {id:'', name:'', unit:'', rp:0, location:'', active:true, balance:0};
  openModal(`<h2>${id ? 'Edit item ' + esc(id) : 'Add item'}</h2>
    <div class="row"><label style="width:120px">Name</label><input id="eiN" value="${esc(s.name)}" class="grow"></div>
    <div class="row"><label style="width:120px">Unit</label><input id="eiU" value="${esc(s.unit)}" placeholder="e.g. box, bottle, pack" class="grow"></div>
    <div class="row"><label style="width:120px">Reorder point</label><input id="eiR" type="number" inputmode="numeric" min="0" value="${s.rp}"><span class="mute">Alert when balance ≤ this</span></div>
    <div class="row"><label style="width:120px">Location</label><input id="eiL" value="${esc(s.location)}" placeholder="e.g. Cabinet A, shelf 2" class="grow"></div>
    <label class="ck"><input type="checkbox" id="eiA" ${s.active?'checked':''}> Active (untick to hide it from requests; its history is kept)</label>
    ${id?`<p class="mute">Current balance ${s.balance}. Renaming is recorded in History, and past movements will show the new name.</p>`:''}
    <div class="row sb"><button class="b" onclick="saveItem('${esc(id)}')">Save</button>
      ${id?`<button class="b bad" onclick="delItem('${esc(id)}')">Delete item</button>`:''}</div>
    ${id?'<p class="mute">Only items with no stock movements or requests can be deleted (e.g. added by mistake). Otherwise, make the item inactive.</p>':''}`);
}
function saveItem(id){ act(async () => {
  await call('saveItem', {id, name:$('#eiN').value, unit:$('#eiU').value, rp:$('#eiR').value, location:$('#eiL').value, active:$('#eiA').checked});
  closeModal(); toast('Saved'); stale(); viewItems();
}); }
function delItem(id){ act(async () => { if (!(await ask('Permanently delete item ' + id + '?', 'Delete', true))) return;
  await call('deleteItem', {id}); closeModal(); toast('Item deleted'); stale(); viewItems();
}); }


const rolePerms = ids => [...new Set(ADM.roles.filter(r => r.active && ids.includes(r.id)).flatMap(r => r.perms))];
const roleName = id => ((ADM && ADM.roles.find(r => r.id === id)) || {name:id}).name;
async function viewUsers(){
  const t = NAV; const adm = await call('listUsers'); if (moved(t)) return; ADM = adm;
  const active = ADM.users.filter(u => u.active), st = ADM.settings || {};
  const apvOpts = active.filter(u => { const p = rolePerms(u.roleIds); return u.email === st.approver || (p.includes('APPROVE') && p.includes('ISSUE')); });
  if (!apvOpts.some(u => u.email === st.approver)) apvOpts.unshift({email:st.approver, name:uname(st.approver)});
  const selfReg = ADM.users.filter(u => u.source === 'self-registered');
  $('#view').innerHTML = `
    <div class="card"><div class="row sb" style="margin-top:0"><h2 style="margin:0">Pilot mode</h2>${st.pilot ? '<span class="badge PENDING">On</span>' : '<span class="badge OFF">Off</span>'}</div>
      <p class="mute">While pilot mode is on, anyone with the shared username and password can sign in with their own email, register themselves, view stock and place requests. All requests go to one approver.</p>
      <label class="ck"><input type="checkbox" id="stPilot" ${st.pilot?'checked':''}> Pilot mode on (shared sign-in + self-registration)</label>
      <div class="row"><label style="width:150px">Shared username</label><input id="stUser" value="${esc(st.username||'')}" class="grow"></div>
      <div class="row"><label style="width:150px">Shared password</label><div class="pw-row grow"><input id="stPass" type="password" value="${esc(st.password||'')}">
        <button class="b sec sm" type="button" onclick="const p=$('#stPass');p.type=p.type==='password'?'text':'password'">Show</button>
        <button class="b sec sm" type="button" onclick="copyText($('#stUser').value+' / '+$('#stPass').value,'Username and password copied')">Copy</button></div></div>
      <div class="row"><label style="width:150px">Approver for all requests</label><select id="stApv" class="grow">${apvOpts.map(u => `<option value="${esc(u.email)}" ${u.email===st.approver?'selected':''}>${esc(u.name)} (${esc(u.email)})</option>`).join('')}</select></div>
      <div class="row"><label style="width:150px">Stay signed in for</label><input id="stDays" type="number" inputmode="numeric" min="1" max="180" value="${st.sessionDays||30}"><span class="mute">days</span></div>
      <label class="ck"><input type="checkbox" id="stCounted" ${st.counted?'checked':''}> Stock has been counted (show balances, block issuing more than in stock, low-stock alerts)</label>
      <p class="mute" style="margin-top:0">This switches on automatically after a completed <b>Count all items</b>.</p>
      <div class="row"><button class="b" onclick="saveSettings()">Save settings</button></div></div>
    <div class="card"><div class="row sb" style="margin-top:0"><h2 style="margin:0">Self-registered users <span class="mute" style="font-weight:400">(${selfReg.length})</span></h2>
        ${selfReg.length ? `<button class="b sec sm" onclick="copyText(ADM.users.filter(u=>u.source==='self-registered').map(u=>u.email).join(', '),'Emails copied')">Copy all emails</button>` : ''}</div>
      <p class="mute">People who signed in with the shared password. When you go live, tap a user to give them a real role and they can then sign in with an email code.</p>
      ${tbl([{h:'Name',main:1},{h:'Email'},{h:'Position / group'},{h:'Registered'},{h:'Role'}], selfReg.slice().reverse().map(u => ({attrs:`class="click" data-email="${esc(u.email)}" onclick="editUser(this.dataset.email)"`,
        cells:[esc(u.name), esc(u.email), esc(u.info||'-'), u.createdAt ? fmt(u.createdAt) : '-', esc(u.roleIds.map(roleName).join(', '))]})), 'Nobody has registered yet')}</div>
    <div class="card"><h2>Who is responsible for what</h2><p class="mute">Responsibilities come from roles. Edit a role's permissions, or change a user's roles below.</p>
      ${tbl([{h:'Task',main:1},{h:'Responsible'}], Object.keys(PERMS).map(p => { const who = active.filter(u => rolePerms(u.roleIds).includes(p));
        return [esc(PERMS[p]), who.length ? `<div class="chips">${who.map(u => `<span class="chip">${esc(u.name)}</span>`).join('')}</div>` : '<span class="diffn">Nobody assigned</span>']; }))}</div>
    <div class="card"><div class="row sb" style="margin-top:0"><h2 style="margin:0">Roles</h2><button class="b sm" onclick="editRole('')">+ Add role</button></div>
      ${tbl([{h:'Role',main:1},{h:'Permissions'},{h:'Users',n:1},{h:'Status'}], ADM.roles.map(r => ({attrs:`class="click" data-id="${esc(r.id)}" onclick="editRole(this.dataset.id)"`,
        cells:[esc(r.name), `<div class="chips">${r.perms.map(p => `<span class="chip">${esc(PERMS[p]||p)}</span>`).join('')}</div>`,
          ADM.users.filter(u => u.roleIds.includes(r.id)).length, r.active?'Active':badge('OFF')]})))}</div>
    <div class="card"><div class="row sb" style="margin-top:0"><h2 style="margin:0">Users</h2><button class="b sm" onclick="editUser('')">+ Add user</button></div>
      <div class="row"><input id="uq" type="search" placeholder="Search name or email..." oninput="filterUsers()" class="grow"></div>
      <div id="uList"></div></div>`;
  filterUsers();
}
function filterUsers(){
  const el = $('#uq'); if (!el || !ADM) return; const q = el.value.trim().toLowerCase();
  put('#uList', tbl([{h:'Name',main:1},{h:'Email'},{h:'Roles'},{h:'Request approver'},{h:'Info'},{h:'Status'}],
    ADM.users.filter(u => !q || u.name.toLowerCase().includes(q) || u.email.includes(q)).map(u => ({attrs:`class="click" data-email="${esc(u.email)}" onclick="editUser(this.dataset.email)"`,
      cells:[esc(u.name), esc(u.email), esc(u.roleIds.map(roleName).join(', ')), esc(u.approverEmail ? uname(u.approverEmail) : '-'), esc([u.info, u.source==='self-registered'?'self-registered':''].filter(Boolean).join(' · ')||'-'), u.active?'Active':badge('OFF')]})), 'No users found'));
}
function editRole(id){
  const r = ADM.roles.find(x => x.id === id) || {id:'', name:'', perms:[], active:true};
  openModal(`<h2>${id ? 'Edit role' : 'Add role'}</h2>
    <div class="row"><label style="width:100px">Role name</label><input id="erN" value="${esc(r.name)}" class="grow" placeholder="e.g. Research assistant, Lab manager"></div>
    <h3 style="margin-top:12px">This role can</h3>
    ${Object.keys(PERMS).map(p => `<label class="ck"><input type="checkbox" class="erP" value="${p}" ${r.perms.includes(p)?'checked':''}> ${esc(PERMS[p])}</label>`).join('')}
    <label class="ck"><input type="checkbox" id="erA" ${r.active?'checked':''}> Active</label>
    <div class="row sb"><button class="b" onclick="saveRole('${esc(id)}')">Save</button>${id?`<button class="b bad" onclick="delRole('${esc(id)}')">Delete role</button>`:''}</div>`);
}
function saveRole(id){ act(async () => {
  await call('saveRole', {id, name:$('#erN').value, perms:[...document.querySelectorAll('.erP:checked')].map(c => c.value), active:$('#erA').checked});
  closeModal(); toast('Role saved'); await refreshUsers(); viewUsers();
}); }
function delRole(id){ act(async () => { if (!(await ask('Delete this role?', 'Delete', true))) return; await call('deleteRole', {id}); closeModal(); toast('Role deleted'); viewUsers(); }); }
function editUser(email){
  const u = ADM.users.find(x => x.email === email) || {email:'', name:'', roleIds:[], approverEmail:'', active:true};
  const apvs = ADM.users.filter(x => x.active && x.email !== email && rolePerms(x.roleIds).includes('APPROVE'));
  openModal(`<h2>${email ? 'Edit user' : 'Add user'}</h2>
    <div class="row"><label style="width:130px">Email</label><input id="euE" type="email" value="${esc(u.email)}" ${email?'readonly':''} class="grow" placeholder="Email used to sign in"></div>
    <div class="row"><label style="width:130px">Full name</label><input id="euN" value="${esc(u.name)}" class="grow"></div>
    ${u.info || u.source ? `<p class="mute" style="margin:4px 0">${esc([u.info, u.source==='self-registered' ? 'Self-registered during the pilot' : ''].filter(Boolean).join(' · '))}</p>` : ''}
    <h3 style="margin-top:12px">Roles (choose one or more)</h3>
    ${ADM.roles.filter(r => r.active || u.roleIds.includes(r.id)).map(r => `<label class="ck"><input type="checkbox" class="euR" value="${esc(r.id)}" ${u.roleIds.includes(r.id)?'checked':''}> ${esc(r.name)}
      <span class="mute">— ${esc(r.perms.map(p => PERMS[p]||p).join(', ') || 'no permissions')}</span></label>`).join('')}
    <div class="row"><label style="width:130px">Request approver</label><select id="euA" class="grow"><option value="">— None (chosen when requesting) —</option>
      ${apvs.map(a => `<option value="${esc(a.email)}" ${a.email===u.approverEmail?'selected':''}>${esc(a.name)}</option>`).join('')}</select></div>
    <label class="ck"><input type="checkbox" id="euX" ${u.active?'checked':''}> Active (untick when someone graduates or leaves — their history is kept)</label>
    <div class="row"><button class="b" onclick="saveUser(${email?'false':'true'})">Save</button></div>`);
}
function saveUser(isNew){ act(async () => {
  await call('saveUser', {isNew, email:$('#euE').value, name:$('#euN').value, approverEmail:$('#euA').value,
    roleIds:[...document.querySelectorAll('.euR:checked')].map(c => c.value), active:$('#euX').checked});
  closeModal(); toast('User saved'); await refreshUsers(); viewUsers();
}); }
function copyText(t, msg){ const done = () => toast(msg || 'Copied');
  if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(done, () => fallbackCopy(t, done)); else fallbackCopy(t, done); }
function fallbackCopy(t, done){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select();
  try { document.execCommand('copy'); done(); } catch(e) { toast('Could not copy', true); } a.remove(); }
function saveSettings(){ act(async () => {
  const p = {pilot:$('#stPilot').checked, username:$('#stUser').value, password:$('#stPass').value, approver:$('#stApv').value,
    sessionDays:Number($('#stDays').value), counted:$('#stCounted').checked};
  const st = ADM.settings || {};
  if (st.pilot && !p.pilot && !(await ask('Turn pilot mode off? The shared password will stop working; only users with a role can sign in (with an email code). People already signed in stay signed in.', 'Turn off', true))) return;
  if (!st.counted && p.counted && !(await ask('Mark stock as counted without doing a full count? Balances shown will only reflect movements recorded so far.', 'Mark as counted', true))) return;
  const r = await call('saveSettings', p);
  toast(r.changes.length ? 'Saved: ' + r.changes.join('; ') : 'No changes'); await refreshUsers(); viewUsers();
}); }
async function refreshUsers(){ const d = await call('boot'); USERS = d.users; ME = d.user; MODE = d.mode || MODE; STOCK = d.stock; STOCK_AT = Date.now();
  $('#labName').innerHTML = esc(d.labName) + (MODE.pilot ? '<span class="pilot-tag">PILOT</span>' : '');
  $('#who').textContent = ME.name + (ME.roleNames.length ? ' · ' + ME.roleNames.join(', ') : ''); }


function loadQRLib(){ return new Promise((res, rej) => { if (window.QRCode) return res();
  const s = document.createElement('script'); s.src = ['https:', '', 'cdnjs.cloudflare.com', 'ajax', 'libs', 'qrcodejs', '1.0.0', 'qrcode.min.js'].join('/');
  s.onload = res; s.onerror = () => rej(new Error('Could not load the QR code generator')); document.head.appendChild(s); }); }
function viewQR(){ act(async () => {
  const items = STOCK.filter(s => s.active);
  $('#view').innerHTML = `<div class="card"><div class="row sb noprint" style="margin-top:0"><h2 style="margin:0">Shelf QR labels</h2>
    <div class="row" style="margin:0"><button class="b sec sm" onclick="go('stock')">Back</button><button class="b sm" onclick="window.print()">Print</button></div></div>
    <p class="mute noprint">Scan a label to open that item's balance and history.</p>
    <div class="qrgrid">${items.map(s => `<div class="qr"><div id="qr_${esc(s.id)}"></div><b>${esc(s.id)}</b><br>${esc(s.name)}</div>`).join('')}</div></div>`;
  if (!APPURL) throw new Error('QR labels need the deployed web app link');
  const t = NAV; await loadQRLib(); if (moved(t)) return;
  items.forEach(s => new QRCode(document.getElementById('qr_'+s.id), {text: APPURL + '?item=' + encodeURIComponent(s.id), width: 110, height: 110}));
}); }

try { init(); } catch (e) { showStartError(e); }
